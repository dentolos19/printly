name: Cloudflare Deployment
run-name: Cloudflare Deployment
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true
env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
jobs:
  deploy:
    name: Deploy Worker
    environment: Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Download Secrets
        uses: SpicyPizza/create-envfile@v2.0
        with:
          directory: src/app
          envkey_APP_URL: ${{ toJSON(vars.APP_URL) }}
          envkey_AWS_ACCESS_KEY_ID: ${{ toJSON(secrets.AWS_ACCESS_KEY_ID) }}
          envkey_AWS_ENDPOINT_URL_S3: ${{ toJSON(vars.AWS_ENDPOINT_URL_S3) }}
          envkey_AWS_REGION: ${{ toJSON(vars.AWS_REGION) }}
          envkey_AWS_SECRET_ACCESS_KEY: ${{ toJSON(secrets.AWS_SECRET_ACCESS_KEY) }}
          envkey_DATABASE_URL: ${{ toJSON(secrets.DATABASE_URL) }}
          envkey_ELEVENLABS_AGENT_ID: ${{ toJSON(secrets.ELEVENLABS_AGENT_ID) }}
          envkey_ELEVENLABS_API_KEY: ${{ toJSON(secrets.ELEVENLABS_API_KEY) }}
          envkey_GOOGLE_CLIENT_ID: ${{ toJSON(secrets.GOOGLE_CLIENT_ID) }}
          envkey_GOOGLE_CLIENT_SECRET: ${{ toJSON(secrets.GOOGLE_CLIENT_SECRET) }}
          envkey_LIVEKIT_API_KEY: ${{ toJSON(secrets.LIVEKIT_API_KEY) }}
          envkey_LIVEKIT_API_SECRET: ${{ toJSON(secrets.LIVEKIT_API_SECRET) }}
          envkey_LIVEKIT_URL: ${{ toJSON(secrets.LIVEKIT_URL) }}
          envkey_OPENROUTER_API_KEY: ${{ toJSON(secrets.OPENROUTER_API_KEY) }}
          envkey_OPENROUTER_IMAGE_MODEL: ${{ toJSON(vars.OPENROUTER_IMAGE_MODEL) }}
          envkey_OPENROUTER_MODEL: ${{ toJSON(vars.OPENROUTER_MODEL) }}
          envkey_OPENROUTER_REFERER: ${{ toJSON(vars.OPENROUTER_REFERER) }}
          envkey_OPENROUTER_TITLE: ${{ toJSON(vars.OPENROUTER_TITLE) }}
          envkey_RESEND_API_KEY: ${{ toJSON(secrets.RESEND_API_KEY) }}
          envkey_RESEND_FROM_EMAIL: ${{ toJSON(vars.RESEND_FROM_EMAIL) }}
          envkey_SECRET_KEY: ${{ toJSON(secrets.SECRET_KEY) }}

      - name: Deploy Worker
        run: just deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
