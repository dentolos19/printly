name: Web Deployment
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
jobs:
  deploy:
    name: Deploy
    environment: Production
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ENV: production
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        working-directory: src/app
        run: bun install --frozen-lockfile

      - name: Build App
        working-directory: src/app
        run: bun run build
        env:
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}

      - name: Build Server
        working-directory: src/server
        run: dotnet build --configuration Release

      - name: Migrate Database
        working-directory: src/server
        run: |
          dotnet tool restore
          dotnet ef database update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Upload Secrets
        working-directory: src/app
        run: |
          echo "${{ secrets.SECRET_KEY }}" | bun wrangler secret put SECRET_KEY
          echo "${{ vars.APP_URL }}" | bun wrangler secret put APP_URL
          echo "${{ secrets.DATABASE_URL }}" | bun wrangler secret put DATABASE_URL
          echo "${{ secrets.GOOGLE_CLIENT_ID }}" | bun wrangler secret put GOOGLE_CLIENT_ID
          echo "${{ secrets.GOOGLE_CLIENT_SECRET }}" | bun wrangler secret put GOOGLE_CLIENT_SECRET
          echo "${{ secrets.LIVEKIT_URL }}" | bun wrangler secret put LIVEKIT_URL
          echo "${{ secrets.LIVEKIT_API_KEY }}" | bun wrangler secret put LIVEKIT_API_KEY
          echo "${{ secrets.LIVEKIT_API_SECRET }}" | bun wrangler secret put LIVEKIT_API_SECRET
          echo "${{ secrets.BUCKET_ENDPOINT_URL }}" | bun wrangler secret put BUCKET_ENDPOINT_URL
          echo "${{ secrets.BUCKET_ACCESS_KEY }}" | bun wrangler secret put BUCKET_ACCESS_KEY
          echo "${{ secrets.BUCKET_SECRET_KEY }}" | bun wrangler secret put BUCKET_SECRET_KEY
          echo "${{ vars.BUCKET_NAME }}" | bun wrangler secret put BUCKET_NAME
          echo "${{ vars.BUCKET_PREFIX }}" | bun wrangler secret put BUCKET_PREFIX
          echo "${{ secrets.OPENROUTER_API_KEY }}" | bun wrangler secret put OPENROUTER_API_KEY
          echo "${{ vars.OPENROUTER_TITLE }}" | bun wrangler secret put OPENROUTER_TITLE
          echo "${{ vars.OPENROUTER_REFERER }}" | bun wrangler secret put OPENROUTER_REFERER
          echo "${{ vars.OPENROUTER_MODEL }}" | bun wrangler secret put OPENROUTER_MODEL
          echo "${{ vars.OPENROUTER_IMAGE_MODEL }}" | bun wrangler secret put OPENROUTER_IMAGE_MODEL
          echo "${{ secrets.STRIPE_SECRET_KEY }}" | bun wrangler secret put STRIPE_SECRET_KEY
          echo "${{ secrets.ELEVENLABS_API_KEY }}" | bun wrangler secret put ELEVENLABS_API_KEY
          echo "${{ secrets.ELEVENLABS_AGENT_ID }}" | bun wrangler secret put ELEVENLABS_AGENT_ID
          echo "${{ secrets.RESEND_API_KEY }}" | bun wrangler secret put RESEND_API_KEY
          echo "${{ vars.RESEND_FROM_EMAIL }}" | bun wrangler secret put RESEND_FROM_EMAIL

      - name: Deploy to Cloudflare
        working-directory: src/app
        run: bun run deploy
