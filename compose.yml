services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: main
      POSTGRES_PASSWORD: printly
      POSTGRES_USER: printly
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U printly -d main" ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
volumes:
  postgres:
